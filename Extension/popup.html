<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Glimpse</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <h1 class="app-title">Screen Glimpse</h1>
      <p class="app-subtitle">Full-Page Capture &amp; Split</p>
    </header>

    <!-- Horizontal Slicing Card -->
    <section class="card">
      <div class="card-title">HORIZONTAL SLICING</div>

      <!-- 2-Option Mode Selector -->
      <div class="segmented-control" role="tablist">
        <button type="button" class="segment-btn active" data-mode="equal">Equal Parts</button>
        <button type="button" class="segment-btn" data-mode="full">Full Page</button>
      </div>

      <!-- Slice Height Input + Calculation Info Badge -->
      <div id="slice-height-group" class="input-group">
        <div class="label-row">
          <label for="slice-height" class="input-label">Slice Height (px)</label>
          <span id="calc-badge" class="calc-badge">Measuring...</span>
        </div>
        <div class="input-wrapper">
          <span class="input-prefix">H</span>
          <input type="number" id="slice-height" value="1080" min="100" step="10">
        </div>
      </div>
    </section>

    <!-- Clean Capture Option (Hide Cookies & Chats) -->
    <section class="card card-row">
      <div class="card-title mb-0">HIDE COOKIES &amp; CHATS</div>
      <label class="switch" title="Automatically hide cookie banners, dark overlays, and chat widgets">
        <input type="checkbox" id="hide-popups-toggle" checked>
        <span class="slider"></span>
      </label>
    </section>

    <!-- Image Format Card -->
    <section class="card card-row">
      <div class="card-title mb-0">IMAGE FORMAT</div>
      <div class="format-group">
        <button type="button" class="format-btn active" data-format="png">PNG</button>
        <button type="button" class="format-btn" data-format="jpeg">JPG</button>
        <button type="button" class="format-btn" data-format="webp">WebP</button>
      </div>
    </section>

    <!-- Primary Capture Button -->
    <button type="button" id="capture-btn" class="capture-btn">
      <svg class="camera-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      <span id="capture-btn-text">Capture &amp; Slice</span>
    </button>

    <!-- Status Indicator -->
    <div id="status-text" class="status-text">Ready to capture</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
